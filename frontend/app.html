<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Intake Assistant - Personal Wishes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .font-mono-code {
            font-family: 'JetBrains Mono', monospace;
        }

        .tab-active {
            border-bottom: 2px solid #1d4ed8;
            color: #1d4ed8;
            background-color: #ffffff;
        }

        .tab-inactive {
            border-bottom: 2px solid transparent;
            color: #64748b;
            background-color: #f8fafc;
        }

        .tab-inactive:hover {
            color: #334155;
            background-color: #f1f5f9;
        }
    </style>
</head>

<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col p-4 md:p-6">
    <div
        class="max-w-7xl w-full mx-auto flex flex-col flex-1 bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

        <!-- Top Header -->
        <header class="px-6 py-4 border-b border-slate-200 flex flex-wrap items-center justify-between gap-4 bg-white">
            <div class="flex items-center space-x-3">
                <div
                    class="w-10 h-10 rounded-xl bg-blue-700 text-white font-bold flex items-center justify-center text-lg shadow-sm">
                    W
                </div>
                <div>
                    <div class="flex items-center space-x-2">
                        <h1 class="text-base font-bold text-slate-900">Document Intake Assistant</h1>
                        <span
                            class="text-[11px] font-semibold uppercase tracking-wider px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 border border-amber-200">Personal
                            Wishes</span>
                    </div>
                    <p class="text-xs text-slate-500">Conversational Legal Information Collector</p>
                </div>
            </div>
            <div class="flex items-center space-x-3">
                <a href="/" class="p-2 text-slate-400 hover:text-slate-700 hover:bg-slate-100 rounded-lg transition"
                    title="Back to Home">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                    </svg>
                </a>
                <div
                    class="w-10 h-10 rounded-xl bg-blue-700 text-white font-bold flex items-center justify-center text-lg shadow-sm">
                    W
                </div>
                <!-- Top Right Header Controls -->
                <div class="flex items-center space-x-3">
                    <span
                        class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                        <span class="w-1.5 h-1.5 mr-1.5 bg-emerald-500 rounded-full animate-pulse"></span>
                        Ready
                    </span>

                    <!-- Download Draft Button with Direct Onclick -->
                    <button id="downloadBtn" type="button" onclick="downloadDraft()"
                        class="inline-flex items-center px-3.5 py-1.5 text-xs font-semibold text-blue-700 bg-blue-50 border border-blue-200 rounded-lg hover:bg-blue-100 cursor-pointer transition shadow-sm active:scale-95"
                        title="Download draft document as text file">
                        <svg class="w-3.5 h-3.5 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Download Draft
                    </button>

                    <!-- Restart Session Button -->
                    <button id="resetBtn" type="button"
                        class="px-3.5 py-1.5 text-xs font-medium text-slate-600 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 cursor-pointer transition shadow-sm active:scale-95">
                        Restart Session
                    </button>
                </div>
        </header>

        <!-- Main Content Workspace -->
        <div class="grid grid-cols-1 lg:grid-cols-12 flex-1 overflow-hidden min-h-[640px]">

            <!-- Left Panel: Chat Intake -->
            <section class="lg:col-span-5 flex flex-col border-b lg:border-b-0 lg:border-r border-slate-200 bg-white">
                <div class="px-5 py-3 border-b border-slate-100 flex items-center justify-between bg-slate-50/60">
                    <div class="flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-blue-600"></span>
                        <span class="text-xs font-bold uppercase tracking-wider text-slate-700">Intake Interview</span>
                    </div>
                    <span class="text-[11px] text-slate-400 font-medium">Live Session Active</span>
                </div>

                <!-- Chat Log -->
                <div id="chatMessages" class="flex-1 p-5 overflow-y-auto space-y-4"></div>

                <!-- Input Area -->
                <div class="p-4 border-t border-slate-200 bg-white">
                    <form id="chatForm" class="flex items-center space-x-2">
                        <input id="userInput" type="text"
                            class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition"
                            placeholder="Type your answer, additions, or corrections..." autocomplete="off" />
                        <button type="submit" id="sendBtn"
                            class="px-5 py-3 bg-blue-700 hover:bg-blue-800 text-white rounded-xl text-sm font-semibold flex items-center space-x-1.5 shadow-sm transition disabled:opacity-50">
                            <span>Send</span>
                            <svg class="w-3.5 h-3.5 text-amber-300 transform rotate-45" fill="currentColor"
                                viewBox="0 0 20 20">
                                <path
                                    d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z">
                                </path>
                            </svg>
                        </button>
                    </form>
                </div>
            </section>

            <!-- Right Panel: Live Document & Structured State Preview -->
            <section class="lg:col-span-7 flex flex-col bg-slate-50/50">

                <!-- Tab Header -->
                <div class="px-6 pt-3 border-b border-slate-200 bg-slate-50 flex items-center justify-between">
                    <div class="flex space-x-2">
                        <button id="tabDocBtn"
                            class="tab-active text-xs font-bold px-4 py-2.5 rounded-t-lg transition flex items-center space-x-2">
                            <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                </path>
                            </svg>
                            <span>Draft Document</span>
                        </button>
                        <button id="tabJsonBtn"
                            class="tab-inactive text-xs font-bold px-4 py-2.5 rounded-t-lg transition flex items-center space-x-2">
                            <svg class="w-4 h-4 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                            </svg>
                            <span>Structured State</span>
                        </button>
                    </div>
                    <span
                        class="text-[11px] font-medium text-slate-400 bg-white px-2 py-0.5 rounded border border-slate-200">Live
                        Synced</span>
                </div>

                <!-- Previews Container -->
                <div class="flex-1 p-6 overflow-y-auto">
                    <div id="viewDoc" class="h-full">
                        <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm min-h-full">
                            <pre id="docPreview"
                                class="font-mono-code text-xs text-slate-800 leading-relaxed whitespace-pre-wrap">Loading draft document...</pre>
                        </div>
                    </div>

                    <div id="viewJson" class="h-full hidden">
                        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 shadow-sm min-h-full">
                            <pre id="jsonPreview"
                                class="font-mono-code text-xs text-emerald-400 leading-relaxed whitespace-pre-wrap">{}</pre>
                        </div>
                    </div>
                </div>
            </section>

        </div>
    </div>

    <!-- Cache-busting query parameter forces browser to reload latest script -->
    <script src="/app.js?v=2"></script>
</body>

</html>
